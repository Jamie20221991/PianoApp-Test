<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glow Piano</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Music&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=4" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="side side-left">
        <div class="brand">
          <p class="eyebrow">Instrument</p>
          <h1>Glow Piano</h1>
        </div>

        <div class="octave-control">
          <button id="octave-down" aria-label="Lower octave">−</button>
          <span id="octave-label">Octaves 2-4</span>
          <button id="octave-up" aria-label="Raise octave">+</button>
        </div>

        <label class="control-group" for="scale-select">
          <span>Scale</span>
          <select id="scale-select">
            <option value="major">Major</option>
            <option value="minor">Minor</option>
            <option value="pentatonic-major">Pentatonic Major</option>
            <option value="pentatonic-minor">Pentatonic Minor</option>
            <option value="blues">Blues</option>
            <option value="dorian">Dorian</option>
            <option value="phrygian">Phrygian</option>
            <option value="lydian">Lydian</option>
            <option value="mixolydian">Mixolydian</option>
          </select>
        </label>

        <label class="control-group" for="root-note-select">
          <span>Root Note</span>
          <select id="root-note-select">
            <option value="C">C</option>
            <option value="C#">C#</option>
            <option value="D">D</option>
            <option value="D#">D#</option>
            <option value="E">E</option>
            <option value="F">F</option>
            <option value="F#">F#</option>
            <option value="G">G</option>
            <option value="G#">G#</option>
            <option value="A">A</option>
            <option value="A#">A#</option>
            <option value="B">B</option>
          </select>
        </label>

        <label class="control-group" for="style-select">
          <span>Finish</span>
          <select id="style-select">
            <option value="classic">Classic Walnut</option>
            <option value="concert">Concert Black</option>
            <option value="vintage">Vintage Mahogany</option>
            <option value="modern">Modern Matte</option>
          </select>
        </label>
      </aside>

      <main class="piano-panel">
        <strong id="note-display" hidden>—</strong>

        <section class="staff-panel">
          <div class="staff-header">
            <label class="staff-toggle">
              <input type="checkbox" id="show-names" checked />
              Show note names
            </label>
            <button id="staff-clear" class="staff-clear">Clear</button>
          </div>
          <canvas id="staff" aria-label="Notes you play, shown on a music staff"></canvas>
        </section>

        <section id="piano" class="piano" aria-label="Piano keyboard" aria-live="polite"></section>
      </main>

      <aside class="side side-right">
        <label class="volume-control" for="volume">
          <span>Volume</span>
          <input id="volume" type="range" min="0" max="100" value="72" />
        </label>

        <label class="control-group" for="sustain">
          <span>Sustain</span>
          <input id="sustain" type="range" min="0" max="100" value="40" />
        </label>

        <label class="control-group" for="reverb">
          <span>Reverb</span>
          <input id="reverb" type="range" min="0" max="100" value="30" />
        </label>

        <label class="control-group" for="tone">
          <span>Tone</span>
          <select id="tone">
            <option value="piano">Piano</option>
            <option value="bright">Bright</option>
            <option value="warm">Warm</option>
          </select>
        </label>

        <button id="demo-btn" class="demo-btn">Play demo</button>
      </aside>
    </div>

    <script src="Staff.js?v=3"></script>
    <script src="script.js?v=3"></script>
  </body>
</html>
</html>
